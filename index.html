<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIAP BPD - KECAMATAN PANGKALAN</title>
<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/9/9d/LAMBANG_KABUPATEN_KARAWANG.svg">
<link rel="shortcut icon" href="https://upload.wikimedia.org/wikipedia/commons/9/9d/LAMBANG_KABUPATEN_KARAWANG.svg">
<link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/9/9d/LAMBANG_KABUPATEN_KARAWANG.svg">
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f5f7fa;
    }

    /* =========================
       LOADING SCREEN
    ========================= */
    #loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #f5f7fa;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity .5s ease, visibility .5s ease;
    }

    #loading.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }

    .loader-container {
        width: min(900px, 90%);
    }

    /* Skeleton Header */
    .skeleton-header {
        height: 70px;
        border-radius: 12px;
        margin-bottom: 20px;
    }

    /* Skeleton Content */
    .skeleton-content {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 20px;
    }

    .skeleton-sidebar {
        height: 450px;
        border-radius: 12px;
    }

    .skeleton-main {
        height: 450px;
        border-radius: 12px;
    }

    /* Skeleton Item */
    .skeleton {
        position: relative;
        overflow: hidden;
        background: #e2e6eb;
    }

    /* Wireframe shimmer */
    .skeleton::after {
        content: "";
        position: absolute;
        inset: 0;

        background: linear-gradient(
            90deg,
            transparent 0%,
            rgba(255,255,255,.65) 50%,
            transparent 100%
        );

        transform: translateX(-100%);
        animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
        100% {
            transform: translateX(100%);
        }
    }

    /* Loading Text */
    .loading-text {
        position: absolute;
        bottom: 40px;
        left: 0;
        width: 100%;
        text-align: center;
        font-family: Arial, sans-serif;
        font-size: 14px;
        color: #68707a;
        letter-spacing: .5px;
    }

    .dots::after {
        content: "";
        animation: dots 1.5s infinite;
    }

    @keyframes dots {
        0%   { content: ""; }
        25%  { content: "."; }
        50%  { content: ".."; }
        75%  { content: "..."; }
        100% { content: ""; }
    }

    /* =========================
       IFRAME
    ========================= */
    #appFrame {
        position: fixed;
        inset: 0;

        width: 100%;
        height: 100%;

        border: none;
        display: block;

        opacity: 0;
        visibility: hidden;

        transition: opacity .5s ease;
    }

    #appFrame.show {
        opacity: 1;
        visibility: visible;
    }

    /* Mobile */
    @media (max-width: 600px) {

        .skeleton-content {
            grid-template-columns: 1fr;
        }

        .skeleton-sidebar {
            display: none;
        }

        .skeleton-main {
            height: 500px;
        }

        .skeleton-header {
            height: 60px;
        }
    }
</style>
</head>

<body>

<!-- =========================
     LOADING WIREFRAME
========================= -->
<div id="loading">

    <div class="loader-container">

        <div class="skeleton skeleton-header"></div>

        <div class="skeleton-content">

            <div class="skeleton skeleton-sidebar"></div>

            <div class="skeleton skeleton-main"></div>

        </div>

    </div>

    <div class="loading-text">
        Memuat aplikasi<span class="dots"></span>
    </div>

</div>


<!-- =========================
     GOOGLE APPS SCRIPT
========================= -->
<iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbyohdXVhWxfgtlCMZFsDY3BbtpSV8K9E_oEZThxkqfLfNDURzJHcvhzx3s0CVQPcNXi/exec"
    allow="fullscreen"
    allowfullscreen>
</iframe>


<script>

    const iframe = document.getElementById("appFrame");
    const loading = document.getElementById("loading");

    /*
     * Ketika iframe selesai dimuat
     */
    iframe.addEventListener("load", function () {

        // Beri sedikit waktu agar render aplikasi selesai
        setTimeout(() => {

            iframe.classList.add("show");
            loading.classList.add("hide");

        }, 500);

    });

</script>

</body>
</html>
